<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Joinha Veículos</title>

    <link
      id="app-icon"
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/joinha-loja-icon-v20-192.png"
    />

    <link
      id="app-shortcut-icon"
      rel="shortcut icon"
      type="image/png"
      href="/joinha-loja-icon-v20-192.png"
    />

    <link
      id="app-apple-touch-icon"
      rel="apple-touch-icon"
      sizes="180x180"
      href="/joinha-loja-icon-v20-512.png"
    />

    <link id="app-manifest" rel="manifest" href="/manifest-loja.webmanifest" />

    <meta
      id="app-name"
      name="application-name"
      content="Joinha Veículos"
    />

    <meta
      id="app-apple-title"
      name="apple-mobile-web-app-title"
      content="Joinha Veículos"
    />

    <meta name="theme-color" content="#081521" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <script>
      (function () {
        var staffRoutes = [
          "/login",
          "/inventory",
          "/leads",
          "/gerentes",
          "/vendedores",
          "/bank-integrations",
          "/trocar-senha"
        ];

        var path = window.location.pathname.toLowerCase();
        var isStaff = staffRoutes.some(function (route) {
          return path === route || path.startsWith(route + "/");
        });

        var manifest = document.getElementById("app-manifest");
        if (manifest) {
          manifest.setAttribute(
            "href",
            isStaff ? "/manifest-staff.webmanifest" : "/manifest-loja.webmanifest"
          );
        }

        if (isStaff) {
          document.title = "Joinha Staff";
          var staffIcon = "/joinha-staff-icon-v20-192.png";
          
          var appIcon = document.getElementById("app-icon");
          var shortcutIcon = document.getElementById("app-shortcut-icon");
          var appleIcon = document.getElementById("app-apple-touch-icon");
          var appName = document.getElementById("app-name");
          var appAppleTitle = document.getElementById("app-apple-title");

          if (appIcon) appIcon.setAttribute("href", staffIcon);
          if (shortcutIcon) shortcutIcon.setAttribute("href", staffIcon);
          if (appleIcon) appleIcon.setAttribute("href", staffIcon);
          if (appName) appName.setAttribute("content", "Joinha Staff");
          if (appAppleTitle) appAppleTitle.setAttribute("content", "Joinha Staff");
        }

                window.OneSignalDeferred = window.OneSignalDeferred || [];
        window.OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.init({
            appId: "4401049a-9c68-4c10-9f19-f05a9a55c2e9",
            serviceWorkerPath: "OneSignalSDKWorker.js",
            serviceWorkerUpdaterPath: "OneSignalSDKUpdaterWorker.js"
          });
        });
        var onesignalScript = document.createElement("script");
        onesignalScript.src = "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
        onesignalScript.defer = true;
        document.head.appendChild(onesignalScript);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
